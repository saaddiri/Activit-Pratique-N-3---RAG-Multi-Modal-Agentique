[project]
name = "rag-multimodal-agentique"
version = "0.1.0"
description = "RAG multimodal agentique (texte + images) sur « Attention Is All You Need » avec CLIP, ChromaDB et Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.4.0",
    "langchain>=1.5.0",
    "langchain-openai>=1.8.0",
    "langchain-text-splitters>=1.1.3",
    "matplotlib>=3.11.2",
    "open-clip-torch>=4.2.2",
    "openai>=3.51.0",
    "pymupdf>=2.1",
    "torch>=2.15.0",
]
